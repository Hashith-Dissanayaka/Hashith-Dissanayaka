name: Update FLOW activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: flow-profile-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Generate profile analytics
        env:
          PROFILE_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py
      - name: Publish activity card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/flow/activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh FLOW activity'
          git pull --rebase
          git push
